name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: version
    attributes:
      label: App version / commit and macOS version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Sanitized diagnostic events (optional)
      description: Do not attach private recordings, transcript exports, raw logs, personal paths, credentials, or model weights.
