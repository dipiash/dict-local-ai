name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  static-checks:
    name: Workflows, formatting and Python syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned static analysis tools
        run: |
          tool_dir=$(mktemp -d "$RUNNER_TEMP/static-tools.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$tool_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/biomejs/biome/releases/download/%40biomejs/biome%402.6.8/biome-linux-x64' \
            -o "$tool_dir/biome"
          printf '%s  %s\n' 'fc1cb7c6664d6fa315144f58bd03096ee5d035e641538840a80262d59203d5dd' "$tool_dir/biome" | sha256sum -c -
          chmod +x "$tool_dir/biome"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflows
        run: actionlint -color
      - name: Check configuration and documentation formatting
        run: |
          git ls-files -z -- '*.json' '*.jsonc' '*.yml' '*.yaml' '*.md' ':!:Resources/Licenses/**' \
            | xargs -0 -r biome format --
      - name: Check syntax of all tracked Python scripts
        run: git ls-files -z -- '*.py' | xargs -0 -r python3 -m py_compile --
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source and Git history
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tool_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" dir . --redact
          "$tool_dir/gitleaks" git . --redact
      - name: Validate tracked source contents
        run: python3 scripts/development/check-public-tree.py
  linux-core:
    runs-on: ubuntu-24.04
    container: swift:6.2.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install test prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends python3 python3-venv libsqlite3-dev
      - name: Check portable contracts and core
        run: |
          bash scripts/development/verify-system-audio.sh
          python3 scripts/development/verify-ui-tokens.py
          python3 -m venv .build/der-tests
          .build/der-tests/bin/pip install -r scripts/evaluation/requirements.txt
          .build/der-tests/bin/python -c "from pyannote.metrics.diarization import DiarizationErrorRate"
          .build/der-tests/bin/python -m unittest discover -s scripts/tests
          swift test
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Swift 6.2 toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          swift --version
      - name: Install development tools
        run: bash scripts/development/bootstrap-tools.sh
      - name: Check native build, tests and lint
        run: task check
      - name: Verify localization from DMG
        run: task test:localization
      - name: Verify dependency pin
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          manifest = Path('Package.swift').read_text()
          revision = re.search(r'revision: "([0-9a-f]{40})"', manifest).group(1)
          pins = json.loads(Path('Package.resolved').read_text())['pins']
          assert len(pins) == 1 and pins[0]['identity'] == 'fluidaudio'
          assert pins[0]['state']['revision'] == revision
          PY
