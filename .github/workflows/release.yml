name: Source release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  source-release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build source archive
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/development/check-public-tree.py
          git archive --format=zip --prefix=dict-local-ai/ -o dict-local-ai-source.zip HEAD
          sha256sum dict-local-ai-source.zip > SHA256SUMS
      - name: Create draft source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Dict Local AI $GITHUB_REF_NAME" \
            --notes 'Source-only release. See README for building on macOS. A Developer ID-signed and notarized binary may be published separately after validation.' \
            dict-local-ai-source.zip SHA256SUMS
